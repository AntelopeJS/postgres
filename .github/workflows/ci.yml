name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly tier, with the Windows jobs and Stress
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      node-versions: "[22, 24]"
      docs-files: |
        README.md
        docs
      renovate-sync: false
      test-job: true
      setup-commands: |
        if [[ "$RUNNER_OS" == Windows ]]; then
          pg_bin=$(cygpath -u "$PGBIN")
          pg_data="$RUNNER_TEMP/pgdata"
          "$pg_bin/initdb" -D "$pg_data" -U postgres -A trust -E UTF8 --locale=C > /dev/null
          "$pg_bin/pg_ctl" start -D "$pg_data" -w -s -l "$RUNNER_TEMP/postgres.log" -o "-c fsync=off" || { cat "$RUNNER_TEMP/postgres.log"; exit 1; }
          "$pg_bin/createdb" -U postgres antelopejs_test
          echo "PG_TEST_URL=postgres://postgres:root@localhost:5432/antelopejs_test" >> "$GITHUB_ENV"
        fi
      affected-tests: true
      nightly: ${{ inputs.nightly == true }}
    permissions:
      contents: read
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
  verdict:
    needs: [ci, renovate-sync]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
