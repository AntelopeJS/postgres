name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      node-versions: "[22, 24]"
      docs-files: |
        README.md
        docs
      renovate-sync: false
      test-job: true
      windows: true
      setup-commands: |
        if [[ "$RUNNER_OS" == Windows ]]; then
          pg_bin=$(cygpath -u "$PGBIN")
          "$pg_bin/pg_ctl" start -D "$PGDATA" -w -s -l "$RUNNER_TEMP/postgres.log"
          PGPASSWORD=root "$pg_bin/createdb" -U postgres antelopejs_test
          echo "PG_TEST_URL=postgres://postgres:root@localhost:5432/antelopejs_test" >> "$GITHUB_ENV"
        fi
    permissions:
      contents: read
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
